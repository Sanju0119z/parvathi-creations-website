<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parvathi Creations - Admin</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .admin-page {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #8b3a62;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #555;
            margin-bottom: 15px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        #imagePreview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 15px;
            display: none;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }

        /* Upload dashboard hidden until login */
        #uploadSection {
            display: none;
        }

        /* Login screen */
        #loginSection {
            display: block;
        }
    </style>
</head>

<body>

<div class="admin-page">

    <div class="admin-card">

        <h1>🌸 Parvathi Creations</h1>


        <!-- ============================= -->
        <!-- LOGIN SECTION -->
        <!-- ============================= -->

        <div id="loginSection">

            <h2>🔐 Admin Login</h2>

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter admin email"
            >

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
            >

            <button
                id="loginButton"
                onclick="loginAdmin()"
            >
                🔐 Login
            </button>

            <div
                id="loginMessage"
                class="message"
            ></div>

            <a class="back-btn" href="index.html">
                ← Back to Website
            </a>

        </div>


        <!-- ============================= -->
        <!-- UPLOAD SECTION -->
        <!-- ============================= -->

        <div id="uploadSection">

            <h2>📤 Admin Upload</h2>

            <button
                class="logout-btn"
                onclick="logoutAdmin()"
            >
                🚪 Logout
            </button>


            <label for="designName">
                Design Name
            </label>

            <input
                type="text"
                id="designName"
                placeholder="Example: Bridal Maggam Blouse"
            >


            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="">
                    Select Category
                </option>

                <option value="Sarees">
                    Sarees
                </option>

                <option value="Blouse">
                    Blouse
                </option>

                <option value="Maggam">
                    Maggam Work
                </option>

                <option value="Wedding Dresses">
                    Wedding Dresses
                </option>

                <option value="Saree Tassels">
                    Saree Tassels
                </option>

                <option value="Frocks">
                    Frocks
                </option>

                <option value="Lehenga">
                    Lehenga
                </option>

            </select>


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Enter details about this design..."
            ></textarea>


            <label for="designImage">
                Design Photo
            </label>

            <input
                type="file"
                id="designImage"
                accept="image/*"
            >


            <img
                id="imagePreview"
                alt="Image Preview"
            >


            <button
                id="uploadButton"
                onclick="uploadDesign()"
            >
                ⬆️ Upload Design
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <a class="back-btn" href="index.html">
                ← Back to Website
            </a>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://ydhqjkyzbbooolaugydk.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_uAy9Zv6zXK_cVFFGJfOxKQ_I1aRhJMs";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // LOGIN
    // ==========================================

    async function loginAdmin() {

        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim();

        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        if (!email || !password) {

            showLoginMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        const loginButton =
            document.getElementById(
                "loginButton"
            );

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {
                throw error;
            }


            if (!data.session) {
                throw new Error(
                    "Login session was not created."
                );
            }


            showUploadSection();


        } catch (error) {

            console.error(error);

            showLoginMessage(
                "Login failed: " + error.message,
                "error"
            );

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "🔐 Login";
    }


    // ==========================================
    // SHOW UPLOAD SECTION
    // ==========================================

    function showUploadSection() {

        document.getElementById(
            "loginSection"
        ).style.display = "none";

        document.getElementById(
            "uploadSection"
        ).style.display = "block";
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logoutAdmin() {

        await supabaseClient.auth.signOut();

        document.getElementById(
            "uploadSection"
        ).style.display = "none";

        document.getElementById(
            "loginSection"
        ).style.display = "block";

        document.getElementById(
            "loginPassword"
        ).value = "";

        showLoginMessage(
            "You have been logged out.",
            "success"
        );
    }


    // ==========================================
    // CHECK EXISTING LOGIN
    // ==========================================

    async function checkLogin() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (session) {

            showUploadSection();

        } else {

            document.getElementById(
                "loginSection"
            ).style.display = "block";

            document.getElementById(
                "uploadSection"
            ).style.display = "none";
        }
    }


    // ==========================================
    // IMAGE PREVIEW
    // ==========================================

    const imageInput =
        document.getElementById(
            "designImage"
        );

    const imagePreview =
        document.getElementById(
            "imagePreview"
        );


    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (file) {

                imagePreview.src =
                    URL.createObjectURL(file);

                imagePreview.style.display =
                    "block";

            } else {

                imagePreview.style.display =
                    "none";
            }

        }
    );


    // ==========================================
    // UPLOAD DESIGN
    // ==========================================

    async function uploadDesign() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            showMessage(
                "Please log in first.",
                "error"
            );

            return;
        }


        const name =
            document.getElementById(
                "designName"
            ).value.trim();

        const category =
            document.getElementById(
                "category"
            ).value;

        const description =
            document.getElementById(
                "description"
            ).value.trim();

        const file =
            document.getElementById(
                "designImage"
            ).files[0];


        if (!name) {

            showMessage(
                "Please enter the design name.",
                "error"
            );

            return;
        }


        if (!category) {

            showMessage(
                "Please select a category.",
                "error"
            );

            return;
        }


        if (!file) {

            showMessage(
                "Please select a design photo.",
                "error"
            );

            return;
        }


        if (!file.type.startsWith("image/")) {

            showMessage(
                "Please select a valid image file.",
                "error"
            );

            return;
        }


        const uploadButton =
            document.getElementById(
                "uploadButton"
            );

        uploadButton.disabled = true;

        uploadButton.textContent =
            "Uploading...";


        try {

            // Create unique filename

            const fileExtension =
                file.name.split(".").pop();

            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                "." +
                fileExtension;


            // Upload image

            const {
                error: uploadError
            } = await supabaseClient.storage
                .from("design-images")
                .upload(
                    fileName,
                    file
                );


            if (uploadError) {
                throw uploadError;
            }


            // Get public URL

            const {
                data: publicUrlData
            } = supabaseClient.storage
                .from("design-images")
                .getPublicUrl(
                    fileName
                );


            const imageUrl =
                publicUrlData.publicUrl;


            // Insert into designs table

            const {
                error: databaseError
            } = await supabaseClient
                .from("designs")
                .insert({

                    name: name,

                    category: category,

                    description: description,

                    image_url: imageUrl,

                    featured: false

                });


            if (databaseError) {
                throw databaseError;
            }


            // Success

            showMessage(
                "✅ Design uploaded successfully!",
                "success"
            );


            // Clear form

            document.getElementById(
                "designName"
            ).value = "";

            document.getElementById(
                "category"
            ).value = "";

            document.getElementById(
                "description"
            ).value = "";

            document.getElementById(
                "designImage"
            ).value = "";

            imagePreview.src = "";

            imagePreview.style.display =
                "none";


        } catch (error) {

            console.error(error);

            showMessage(
                "Upload failed: " +
                error.message,
                "error"
            );

        }


        uploadButton.disabled = false;

        uploadButton.textContent =
            "⬆️ Upload Design";
    }


    // ==========================================
    // MESSAGES
    // ==========================================

    function showLoginMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "loginMessage"
            );

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";
    }


    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";
    }


    // ==========================================
    // START
    // ==========================================

    checkLogin();

</script>

</body>
</html>
